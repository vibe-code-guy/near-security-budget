name: pages

# Publishes the static dashboard in site/ to GitHub Pages.
# It does nothing until the repository owner turns it on:
#   1. make the repository public;
#   2. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions";
#   3. Settings -> Secrets and variables -> Actions -> Variables: add PAGES_ENABLED = true
#      (or run this workflow by hand from the Actions tab).
# Until then every push skips the job, so this workflow never fails the build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
