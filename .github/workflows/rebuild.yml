name: rebuild

# Rebuilds every table and the dashboard data from the cached raw files, runs the tests,
# and fails if the committed outputs differ from the fresh rebuild. No network, no secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make all
      - name: Committed outputs match a fresh rebuild
        run: git diff --exit-code -- data site
