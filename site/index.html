<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEAR security budget</title>
<style>
:root{
  color-scheme:light;
  --page:#f6f4ee; --panel:#fbfaf6; --ink:#16161a; --ink2:#45443f; --ink3:#7c7a73; --rule:#d6d3c8; --rule2:#e7e4da; --wash:#eeebe2;
  --accent:#0b5d66; --accent2:#9fc6c9; --peer:#8f8d85; --peer2:#cfccc2;
  --fail:#a3301c; --hold:#1e6a3a; --cant:#8a5e00; --failbg:#f6ddd6; --okbg:#e9e6dc; --nabg:#f1efe8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#121211; --panel:#191918; --ink:#ecebe6; --ink2:#c2c0b7; --ink3:#8e8c84; --rule:#35342f; --rule2:#272724; --wash:#1f1f1d;
    --accent:#5fbcc4; --accent2:#2c5f64; --peer:#8a8880; --peer2:#4b4a45;
    --fail:#ee8a73; --hold:#6cc08a; --cant:#dbab45; --failbg:#3a1d17; --okbg:#262623; --nabg:#1d1d1b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:36px;letter-spacing:-.01em}
h2{font-size:27px}
h3{font-size:18px;line-height:1.25}
p{margin:8px 0;max-width:74ch}
.num,td.num,th.num,time,code,pre,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

nav{position:sticky;top:0;z-index:10;background:var(--page);border-bottom:1px solid var(--rule)}
nav .in{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:46px;overflow-x:auto;white-space:nowrap}
nav .brand{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}
nav a.l{font-size:14px;color:var(--ink2);text-decoration:none}
nav a.l:hover{color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 96px}
section{scroll-margin-top:60px}

.mast{display:grid;grid-template-columns:1fr auto;gap:8px 32px;align-items:end;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.mast .finding{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink2);max-width:66ch;margin:8px 0 0}
.byline{font-size:14px;color:var(--ink2);text-align:right;line-height:1.6}
.byline b{color:var(--ink);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--rule);margin-top:16px}
.kpi{padding:13px 16px 13px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);border-top:1px solid var(--rule);margin-top:-1px;background:var(--panel);min-width:0}
.kpi .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);min-height:2.7em;line-height:1.35}
.kpi .v{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1.1;margin:4px 0 6px;white-space:nowrap}
.kpi .v small{font-size:16px;font-weight:400;color:var(--ink2)}
.kpi .c{font-size:14px;color:var(--ink2);line-height:1.4}
.kpi.bad .v{color:var(--fail)} .kpi.good .v{color:var(--hold)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:16px;border:1px solid var(--rule);background:var(--panel)}
.panel{padding:14px 18px;border-right:1px solid var(--rule);min-width:0}
.panel:last-child{border-right:0}
.panel .claim{font-size:14px;color:var(--ink2);margin:4px 0 8px;min-height:3em;line-height:1.45}
.word{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1}
.w-fails{color:var(--fail)} .w-holds{color:var(--hold)} .w-cant{color:var(--cant)}
.caveat{font-size:14px;color:var(--ink);margin:6px 0 0;line-height:1.4}
.decide{margin-top:10px;font-size:14px;color:var(--ink2);line-height:1.4}
.decide .big{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink);margin-right:8px}

.sec{margin-top:64px;padding-top:24px;border-top:2px solid var(--ink)}
.sechead{display:grid;grid-template-columns:1.1fr 1fr;gap:10px 44px;align-items:start;margin-bottom:8px}
.sechead .tagline{display:flex;gap:12px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.pill{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.04em}
.sechead p{margin:0;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:18px}
.card{grid-column:span 6;background:var(--panel);border:1px solid var(--rule);padding:16px 18px 14px;min-width:0}
.card.w12{grid-column:span 12} .card.w7{grid-column:span 7} .card.w5{grid-column:span 5} .card.w8{grid-column:span 8} .card.w4{grid-column:span 4}
.card h3{margin-bottom:3px}
.card .sub{font-size:14px;color:var(--ink2);margin:0 0 8px;max-width:none;line-height:1.45}
.chart{width:100%}
.src{font-size:12.5px;color:var(--ink3);margin-top:8px}
details{margin-top:10px;border-top:1px solid var(--rule2)}
summary{cursor:pointer;padding:8px 0 2px;font-size:14px;color:var(--ink2)}
pre{margin:6px 0;padding:12px 14px;background:var(--wash);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
code{font-size:.9em;background:var(--wash);padding:1px 4px}
.scroll{overflow-x:auto} .tall{max-height:440px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 14px 7px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--ink3);white-space:nowrap}
th[data-k]{cursor:pointer} th[data-k]:after{content:" \2195";color:var(--peer2)} th.asc:after{content:" \2191";color:var(--ink)} th.desc:after{content:" \2193";color:var(--ink)}
td.num,th.num{text-align:right;padding-right:20px;padding-left:6px;white-space:nowrap}
td.num:last-child,th.num:last-child{padding-right:0}
td time,td .num{white-space:nowrap}
tr.near td:first-child{box-shadow:inset 3px 0 0 var(--accent);padding-left:9px}
tr.near td{color:var(--ink);font-weight:600}
.small{font-size:14px;color:var(--ink2)}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cant);border:1px solid currentColor;padding:0 5px;white-space:nowrap;font-family:var(--sans);font-weight:600}
table.matrix td{padding:10px 12px;border-bottom:3px solid var(--panel);border-right:3px solid var(--panel)}
table.matrix td:first-child{padding-left:0}
td.cell{min-width:150px}
td.c-one{background:var(--failbg)} td.c-multi{background:var(--okbg)} td.c-na{background:repeating-linear-gradient(135deg,var(--nabg) 0 6px,transparent 6px 10px);border:1px dashed var(--rule)}
.sig{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;display:block}
.c-one .sig{color:var(--fail)} .c-na .sig{color:var(--ink3);font-weight:600;font-size:15px;font-family:var(--sans)}
.subl{display:block;font-size:12.5px;color:var(--ink2);font-family:var(--sans);font-weight:400;margin-top:3px;line-height:1.35}
ul.plain{margin:6px 0;padding-left:18px} ul.plain li{margin:6px 0}
ol.log{margin:6px 0;padding-left:24px;font-size:14px;color:var(--ink2);columns:2;column-gap:40px} ol.log li{margin:4px 0;break-inside:avoid}
svg.dia{display:block;width:100%;height:auto;min-width:860px}
svg.dia text{font-family:var(--sans);font-size:14px;fill:var(--ink)} svg.dia text.s{font-size:12.5px;fill:var(--ink2)} svg.dia text.e{font-size:13px;fill:var(--ink)} svg.dia text.bad{fill:var(--fail);font-weight:700}
.durs{display:grid;grid-template-columns:repeat(3,1fr);gap:0 24px;margin-top:6px}
.durs .v{font-family:var(--mono);font-size:26px;font-weight:600} .durs .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
footer{margin-top:56px;padding-top:14px;border-top:2px solid var(--ink);font-size:14px;color:var(--ink2)}
button.copy{font:inherit;font-size:12px;color:var(--accent);background:none;border:1px solid var(--rule);border-radius:3px;padding:0 7px;margin-left:8px;cursor:pointer}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)} .strip{grid-template-columns:1fr} .panel{border-right:0;border-bottom:1px solid var(--rule)} .panel:last-child{border-bottom:0} .panel .claim{min-height:0}
  .card,.card.w7,.card.w5,.card.w8,.card.w4{grid-column:span 12} .sechead{grid-template-columns:1fr} .mast{grid-template-columns:1fr} .byline{text-align:left} ol.log{columns:1} .durs{grid-template-columns:1fr;gap:10px}
}
@media (max-width:560px){ main{padding:18px 14px 64px} nav .in{padding:0 14px;gap:16px} h1{font-size:28px} h2{font-size:22px} .kpis{grid-template-columns:1fr} .kpi .l{min-height:0} .sec{margin-top:48px} }
@media print{
  :root{--page:#fff;--panel:#fff;--ink:#000;--ink2:#222;--ink3:#555;--rule:#bbb;--rule2:#ddd;--wash:#f3f3f3}
  nav,button.copy{display:none} main{max-width:none;padding:0} .card,.kpi,.panel{break-inside:avoid} .tall{max-height:none;overflow:visible} a{color:inherit}
}
</style>
</head>
<body>
<nav><div class="in"><a class="brand" href="#top">NEAR security budget</a><a class="l" href="#kpi">Key figures</a><a class="l" href="#verdicts">Verdicts</a><a class="l" href="#c2">Losses (C2)</a><a class="l" href="#c1">Bounties (C1)</a><a class="l" href="#c3">Control (C3)</a><a class="l" href="#case">1 October</a><a class="l" href="#against">Limits</a><a class="l" href="#prov">Provenance</a></div></nav>
<main id="top">
<header class="mast" id="mast"></header>
<section id="kpi"><div class="kpis" id="kpis"></div></section>
<section id="verdicts"><div class="strip" id="strip"></div></section>
<section class="sec" id="c2"></section>
<section class="sec" id="c1"></section>
<section class="sec" id="c3"></section>
<section class="sec" id="case"></section>
<section class="sec" id="against"></section>
<section class="sec" id="prov"></section>
<footer id="foot"></footer>
</main>
<script src="vendor/echarts/echarts.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DATA, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const usd = x => { x = +x; if (!isFinite(x)) return ""; const a = Math.abs(x);
  return a >= 1e9 ? "$" + (x/1e9).toFixed(2) + "B" : a >= 1e6 ? "$" + (x/1e6).toFixed(1) + "M" : a >= 1e3 ? "$" + (x/1e3).toFixed(0) + "K" : "$" + x.toFixed(0); };
const usdA = v => v >= 1e9 ? "$" + +(v / 1e9).toFixed(1) + "B" : v >= 1e6 ? "$" + +(v / 1e6).toFixed(1) + "M" : v >= 1e3 ? "$" + +(v / 1e3).toFixed(0) + "K" : "$" + v;
const pct = (x, d = 2) => (+x).toFixed(d) + "%";
const N = n => (+n).toLocaleString("en-US");
const short = a => a.length > 24 ? a.slice(0, 8) + "…" + a.slice(-4) : a;
const hm = m => Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min";
const WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
const word = n => WORDS[n] ?? String(n);
const VW = {"holds": ["HOLDS", "w-holds"], "fails": ["FAILS", "w-fails"], "can't tell": ["CAN’T TELL", "w-cant"]};
const vword = v => `<span class="${(VW[v] || ["", ""])[1]}">${(VW[v] || [String(v).toUpperCase()])[0]}</span>`;
const CN = c => c === "Near" ? "NEAR" : c;
function table(cols, rows, rowClass, sortable, cls) {
  return `<table class="${sortable ? "sortable " : ""}${cls || ""}"><thead><tr>${cols.map((c, i) => `<th class="${c.num ? "num" : ""}"${sortable ? ` data-k="${i}"` : ""}>${esc(c.h)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr class="${rowClass ? rowClass(r) : ""}">${cols.map(c => `<td class="${c.num ? "num" : ""} ${c.c ? c.c(r) : ""}"${c.s ? ` data-s="${esc(c.s(r))}"` : ""}>${c.f(r)}</td>`).join("")}</tr>`).join("") + `</tbody></table>`;
}
const how = text => `<details><summary>How this was computed</summary><pre>${esc(text)}</pre></details>`;
const card = (cls, title, sub, body, src) => `<div class="card ${cls}"><h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}${body}${src ? `<div class="src">Source: ${src}</div>` : ""}</div>`;
const c1 = D.c1, c1s = D.c1_sensitivity, c2 = D.c2, c3 = D.c3, R = D.retrieval, reg = D.registration, T = D.timeline_derived, AS_OF = D.snapshot.snapshot_date;
const C1_CAVEAT = `can’t tell under the stricter reading; the peer bar is zero in ${word(c1.zero_bar_bands)} of ${word(c1.bands_total)} size bands`;
const rate = Object.fromEntries(D.c2_rates.map(r => [r.chain, r]));
const worse = D.c2_rates.filter(r => r.chain !== "Near" && +r.loss_rate_lower_pct_per_year > c2.near_lower).map(r => r.chain);
const rows1 = D.c1_rows, liveRows = rows1.filter(r => r.status === "live");
const maxBy = a => a.reduce((m, r) => +r.effective_max_usd > +m.effective_max_usd ? r : m);
const nearCap = maxBy(liveRows.filter(r => r.chain === "Near")), peerCap = maxBy(liveRows.filter(r => r.chain !== "Near"));
const intentsHack = D.c2_hacks.find(h => h.name === "NEAR Intents" && h.chain === "Near");
const IP = c3.intents_path, medRange = `${pct(c2.peer_median_lower)}–${pct(c2.peer_median_upper)}`;

/* ---------- charts: one helper, one style ---------- */
const charts = [];
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const theme = () => ({ink: cssv("--ink"), ink2: cssv("--ink2"), ink3: cssv("--ink3"), rule: cssv("--rule2"), page: cssv("--panel"), accent: cssv("--accent"), accent2: cssv("--accent2"),
  peer: cssv("--peer"), peer2: cssv("--peer2"), fail: cssv("--fail"), mono: cssv("--mono"), sans: cssv("--sans"), wash: cssv("--wash")});
function base(t) {
  const axis = {axisLine: {lineStyle: {color: t.ink3, width: 1}}, splitLine: {lineStyle: {color: t.rule, width: 1}},
    axisLabel: {color: t.ink2, fontFamily: t.mono, fontSize: 12}, nameTextStyle: {color: t.ink2, fontFamily: t.sans, fontSize: 12}};
  return {axis, cat: {color: t.ink, fontFamily: t.sans, fontSize: 13}, opt: {animation: false, textStyle: {fontFamily: t.sans, color: t.ink2}, grid: {left: 8, right: 24, top: 18, bottom: 6, containLabel: true},
    tooltip: {trigger: "item", confine: true, backgroundColor: t.ink, borderWidth: 0, padding: [7, 10], textStyle: {color: t.page, fontSize: 13, fontFamily: t.sans}}}};
}
const lab = (t, extra) => Object.assign({show: true, color: t.ink, fontFamily: t.mono, fontSize: 12}, extra);
const legend = t => ({top: 0, left: 0, itemWidth: 12, itemHeight: 10, textStyle: {color: t.ink2, fontSize: 12.5}});
function mount(id, height, build) {
  const el = document.getElementById(id); if (!el || typeof echarts === "undefined") return;
  el.style.height = height + "px";
  const ch = echarts.init(el, null, {renderer: "svg"}), draw = () => ch.setOption(build(theme()), true);
  draw(); charts.push({ch, draw});
}
window.addEventListener("resize", () => charts.forEach(c => c.ch.resize()));
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => charts.forEach(c => c.draw()));

/* ---------- masthead, KPI row, verdicts ---------- */
$("#mast").innerHTML = `<div><div class="kicker">Investment thesis, tested against public data · NEAR Hackathon</div><h1>NEAR security budget</h1>
  <p class="finding">NEAR covers its largest protocols with bug bounties at least as well as its peers. The security discount is in what it has lost to hacks and in who can change the contracts.</p></div>
  <div class="byline"><b>Vibe Code Guy</b>, bug bounty hunter<br>Data as of <span class="num">${esc(AS_OF)}</span><br>Peers: Solana, Sui, Aptos, Base</div>`;

$("#kpis").innerHTML = [
  ["bad", "Hack losses per year, share of average TVL", pct(c2.near_lower), `peer median ${medRange}`],
  ["good", "Top-10 TVL covered by a live public bounty", pct(c1.near_coverage_pct, 1), `peer median ${pct(c1.peer_median_coverage_pct, 1)}`],
  ["bad", "Fewest signers who can upgrade intents.near", String(c3.intents_min_signers), `a Sputnik factory key; by DAO vote it takes ${IP.dao_votes_needed} of ${IP.dao_council_size}`],
  ["bad", "Assessed TVL behind an upgrade delay", pct(c3.c3b_share_with_enforced_delay_pct, 0), `of ${usd(c3.c3b_base_tvl_usd)}; the test needed over 50%`],
  ["", "Lost in the 1 October 2026 exploit", usd(intentsHack.amount_usd), "returned in full, per the postmortem"],
  ["", "Detection to pause", `${T.detection_to_pause_minutes}<small> min</small>`, "by one account holding one key"],
  ["", "Detection to fix on mainnet", hm(T.detection_to_fix_deployed_minutes).replace(" h ", "<small> h </small>").replace(" min", "<small> min</small>"), `after ${hm(T.first_withdrawal_to_detection_minutes)} undetected`],
  ["", "Largest critical bounty cap on NEAR", usd(nearCap.effective_max_usd), `largest peer cap: ${usd(peerCap.effective_max_usd)} (${esc(peerCap.protocol)})`],
].map(k => `<div class="kpi ${k[0]}"><div class="l">${k[1]}</div><div class="v">${k[2]}</div><div class="c">${k[3]}</div></div>`).join("");

$("#strip").innerHTML = [
  ["C1", "Bounty coverage", "NEAR’s ten largest protocols are covered by public bug bounties at least as well as peers’.", c1.verdict, C1_CAVEAT,
    pct(c1.near_coverage_pct, 1), `of top-10 TVL covered. Bar: peer median ${pct(c1.peer_median_coverage_pct, 1)} less 10 points.`, "#c1"],
  ["C2", "Incident record", "Over 24 months NEAR has lost no more to hacks, relative to what it held, than peers.", c2.verdict, worse.length ? `${worse.join(" and ")} lost more than NEAR; the other peers lost less` : "every peer lost less",
    pct(c2.near_lower), `of average TVL lost per year. Bar: peer median ${medRange}.`, "#c2"],
  ["C3", "Control", "No single signer can upgrade or drain intents.near or the largest NEAR protocols, and upgrades wait out a delay.", c3.C3, `signers test ${c3.C3a}; delay test ${c3.C3b}`,
    c3.intents_min_signers + (c3.intents_min_signers === 1 ? " signer" : " signers"), `can replace the DAO behind intents.near. Bar: more than one. Delay on ${pct(c3.c3b_share_with_enforced_delay_pct, 0)} of TVL; bar: over 50%.`, "#c3"],
].map(p => `<div class="panel"><div class="kicker">${p[0]} · ${p[1]}</div><p class="claim">${p[2]}</p>
  <div class="word">${vword(p[3])}</div><p class="caveat">${esc(p[4])}</p>
  <div class="decide"><span class="big">${esc(p[5])}</span>${esc(p[6])} <a href="${p[7]}">Evidence ↓</a></div></div>`).join("");

/* ---------- C2 ---------- */
(function () {
  const rows = D.c2_rates, nr = rate.Near, S = D.c2_sensitivity, fees = D.fees.filter(r => r.fee_data === "yes");
  const hacks = D.c2_hacks.slice().sort((a, b) => (+b.amount_usd || 0) - (+a.amount_usd || 0));
  const worstFee = fees.reduce((m, r) => +r.losses_over_fees > +m.losses_over_fees ? r : m), win = `24 months to ${AS_OF}`;
  $("#c2").innerHTML = `<div class="sechead"><div><div class="tagline"><span class="kicker">C2 · Incident record</span><span class="pill">${vword(c2.verdict)}</span></div>
    <h2>NEAR lost more to hacks, relative to what it held, than ${word(rows.length - 1 - worse.length)} of ${word(rows.length - 1)} peers</h2></div>
    <p>NEAR lost ${usd(nr.losses_lower_usd)} in ${nr.hacks_lower} hacks over 24 months: ${pct(c2.near_lower)} of its average TVL per year. The peer median is ${medRange}. ${worse.length ? esc(worse.join(" and ")) + " lost more." : ""}</p></div>
  <div class="grid">

/* ---------- sortable tables ---------- */
document.querySelectorAll("table.sortable").forEach(tb => tb.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
  const k = +th.dataset.k, dir = th.classList.contains("asc") ? -1 : 1, body = tb.tBodies[0];
  tb.querySelectorAll("th").forEach(x => x.classList.remove("asc", "desc")); th.classList.add(dir === 1 ? "asc" : "desc");
  const val = tr => { const td = tr.children[k], v = td.dataset.s ?? td.textContent; return /^-?[\d.]+$/.test(String(v).trim()) ? parseFloat(v) : String(v).toLowerCase(); };
  [...body.rows].sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; }).forEach(r => body.appendChild(r));
})));
