<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEAR security budget</title>
<style>
:root{
  color-scheme:light;
  --page:#f7f5ef; --ink:#17171a; --ink2:#4d4c48; --ink3:#86847d; --rule:#d9d6cc; --rule2:#e9e6dd; --wash:#efece3;
  --accent:#0f5c63; --peer:#9a9890; --peer2:#c9c6bc;
  --fail:#a3301c; --hold:#1e6a3a; --cant:#8a5e00;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#131312; --ink:#ecebe6; --ink2:#bdbbb2; --ink3:#85837b; --rule:#34332f; --rule2:#262623; --wash:#1c1c1a;
    --accent:#58b5bd; --peer:#7d7b74; --peer2:#4a4944;
    --fail:#ec8068; --hold:#6cc08a; --cant:#dbab45;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 var(--sans)}
main{max-width:1100px;margin:0 auto;padding:36px 28px 96px}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:38px;letter-spacing:-.01em}
h2{font-size:27px;max-width:36ch}
h3{font-size:18px;margin-top:34px}
p{margin:10px 0;max-width:72ch}
.num,td.num,th.num,time,code,pre,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.mast{padding-bottom:18px;border-bottom:2px solid var(--ink)}
.mast .thesis{font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--ink2);max-width:70ch;margin:10px 0 12px}
.byline{font-size:13.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 18px}
.byline b{font-weight:600;color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.panel{padding:20px 22px 18px 0;border-right:1px solid var(--rule);margin-right:22px;min-width:0}
.panel:last-child{border-right:0;margin-right:0;padding-right:0}
.panel .claim{font-size:14px;color:var(--ink2);min-height:3.1em;margin:6px 0 8px}
.word{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1;letter-spacing:.01em}
.w-fails{color:var(--fail)} .w-holds{color:var(--hold)} .w-cant{color:var(--cant)}
.caveat{font-size:13px;color:var(--ink2);margin:8px 0 0;max-width:34ch}
.decide{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.decide .big{font-family:var(--mono);font-size:24px;font-weight:600}
.decide .bar{font-size:13px;color:var(--ink2)}
.panel a.more{display:inline-block;margin-top:10px;font-size:13px}

.prov{display:grid;grid-template-columns:repeat(4,1fr);gap:0 22px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink2)}
.prov div{min-width:0}
.prov .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.prov .v{overflow-wrap:anywhere}
button.copy{font:inherit;font-size:11.5px;color:var(--accent);background:none;border:1px solid var(--rule);border-radius:3px;padding:0 6px;margin-left:6px;cursor:pointer}
.order{grid-column:1/-1;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule2)}

section{padding-top:44px;margin-top:44px;border-top:1px solid var(--ink)}
section.first{border-top:0;margin-top:0;padding-top:30px}
.lede{font-family:var(--serif);font-size:19px;line-height:1.5;max-width:68ch;color:var(--ink)}
.sectag{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.pill{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.04em}
.what{color:var(--ink2);font-size:14.5px;margin:6px 0 4px}
figure{margin:22px 0 6px}
figcaption{font-size:13px;color:var(--ink3);margin-bottom:6px;letter-spacing:.02em}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
svg text.n{font-family:var(--mono)}
svg text.strong{fill:var(--ink);font-weight:600}
svg .ax{stroke:var(--ink3);stroke-width:1}
svg .gr{stroke:var(--rule2);stroke-width:1}
details{margin:14px 0 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}
summary{cursor:pointer;padding:8px 0;font-size:13px;color:var(--ink2);letter-spacing:.02em}
pre{margin:0 0 12px;padding:12px 14px;background:var(--wash);font-size:12.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
code{font-size:.88em;background:var(--wash);padding:1px 4px}
.scroll{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 14px 7px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--ink3);white-space:nowrap}
td.num,th.num{text-align:right;padding-right:22px;padding-left:8px;white-space:nowrap}
td.num:last-child,th.num:last-child{padding-right:0}
tr.near td{color:var(--ink)} tr.near td:first-child{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
.small{font-size:13px;color:var(--ink2)}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cant);border:1px solid currentColor;padding:0 5px;white-space:nowrap}
.sig{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.1}
.sig.bad{color:var(--fail)} .sig.na{color:var(--ink3);font-weight:400;font-size:14px}
.sub{display:block;font-size:11.5px;color:var(--ink3);font-family:var(--sans);font-weight:400;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 44px}
.cols h3{margin-top:26px}
ul.plain{margin:8px 0;padding-left:18px;max-width:72ch} ul.plain li{margin:6px 0}
ol.log{margin:8px 0;padding-left:22px;font-size:14px;color:var(--ink2)} ol.log li{margin:4px 0}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:0 22px;margin:18px 0 6px}
.dur .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.dur .v{font-family:var(--mono);font-size:24px;font-weight:600}
.dur .s{font-size:13px;color:var(--ink2)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);font-size:12.5px;line-height:1.4;padding:7px 9px;max-width:300px;opacity:0;transition:opacity .08s;z-index:5}
footer{margin-top:56px;padding-top:16px;border-top:2px solid var(--ink);font-size:13px;color:var(--ink2)}
@media (max-width:820px){
  main{padding:22px 16px 64px} h1{font-size:30px} h2{font-size:23px}
  .strip{grid-template-columns:1fr} .panel{border-right:0;margin-right:0;padding-right:0;border-bottom:1px solid var(--rule2)} .panel:last-child{border-bottom:0}
  .panel .claim{min-height:0}
  .prov{grid-template-columns:1fr 1fr;gap:10px 18px} .cols{grid-template-columns:1fr} .dur{grid-template-columns:1fr;gap:12px}
  figure{overflow-x:auto} figure svg{min-width:700px;overflow:hidden}
  .caveat{max-width:none}
}
@media print{
  :root{--page:#fff;--ink:#000;--ink2:#222;--ink3:#555;--rule:#bbb;--rule2:#ddd;--wash:#f3f3f3;--accent:#0f5c63;--peer:#888;--peer2:#bbb;--fail:#8a1f0e;--hold:#14532b;--cant:#6b4900}
  body{font-size:11pt} main{max-width:none;padding:0} section{break-inside:auto;margin-top:22pt;padding-top:14pt}
  figure,table,.panel{break-inside:avoid} button.copy,#tip{display:none} a{color:inherit}
  .scroll{overflow:visible}
}
</style>
</head>
<body>
<main>
<header class="mast" id="mast"></header>
<div class="strip" id="strip"></div>
<div class="prov" id="prov"></div>
<section class="first" id="summary"></section>
<section id="c1"></section>
<section id="c2"></section>
<section id="c3"></section>
<section id="case"></section>
<section id="against"></section>
<footer id="foot"></footer>
</main>
<div id="tip"></div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DATA, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const usd = x => { x = +x; if (!isFinite(x)) return ""; const a = Math.abs(x);
  return a >= 1e9 ? "$" + (x/1e9).toFixed(2) + "B" : a >= 1e6 ? "$" + (x/1e6).toFixed(1) + "M" : a >= 1e3 ? "$" + (x/1e3).toFixed(0) + "K" : "$" + x.toFixed(0); };
const pct = (x, d = 2) => (+x).toFixed(d) + "%";
const short = a => a.length > 24 ? a.slice(0, 8) + "…" + a.slice(-4) : a;
const hm = m => Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min";
const WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
const word = n => WORDS[n] ?? String(n);
const VW = {"holds": ["HOLDS", "w-holds"], "fails": ["FAILS", "w-fails"], "can't tell": ["CAN’T TELL", "w-cant"]};
const vword = v => `<span class="${(VW[v] || ["", ""])[1]}">${(VW[v] || [String(v).toUpperCase()])[0]}</span>`;
function table(cols, rows, rowClass) {
  return `<div class="scroll"><table><thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr class="${rowClass ? rowClass(r) : ""}">${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
}
const how = text => `<details><summary>How this was computed</summary><pre>${esc(text)}</pre></details>`;
const tip = $("#tip");
function hover(el) {
  el.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); if (!t) { tip.style.opacity = 0; return; }
    tip.innerHTML = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
  el.addEventListener("mouseleave", () => tip.style.opacity = 0);
}
const c1 = D.c1, c1s = D.c1_sensitivity, c2 = D.c2, c3 = D.c3, R = D.retrieval, reg = D.registration, T = D.timeline_derived;
const C1_CAVEAT = c1 ? `can’t tell under the stricter reading; the peer bar is zero in ${word(c1.zero_bar_bands)} of ${word(c1.bands_total)} size bands` : "";
const rate = Object.fromEntries(D.c2_rates.map(r => [r.chain, r]));
const worse = D.c2_rates.filter(r => r.chain !== "Near" && +r.loss_rate_lower_pct_per_year > c2.near_lower).map(r => r.chain);

/* ---------- masthead, verdict strip, provenance ---------- */
$("#mast").innerHTML = `<div class="kicker">Investment thesis, tested against public data · NEAR Hackathon</div>
  <h1>NEAR security budget</h1>
  <p class="thesis">NEAR’s long-term value rests on being trusted to settle agent money. That trust is measurable as security budget: what the ecosystem pays to find bugs, and who can stop or change the contracts, relative to the value they secure.</p>
  <div class="byline"><span><b>Vibe Code Guy</b>, bug bounty hunter</span><span>Data as of <span class="num">${esc(D.snapshot.snapshot_date)}</span></span><span>NEAR mainnet blocks <span class="num">${R.near_block_min}–${R.near_block_max}</span></span><span>Peers: Solana, Sui, Aptos, Base</span></div>`;

$("#strip").innerHTML = [
  ["C1", "Bounty coverage", "NEAR’s ten largest protocols are covered by public bug bounties at least as well as peers’.", c1 && c1.verdict, c1 ? C1_CAVEAT : "Not computed: the bounty table is empty.",
    c1 ? pct(c1.near_coverage_pct, 1) : "", c1 ? `of top-10 TVL covered · bar: peer median ${pct(c1.peer_median_coverage_pct, 1)} less 10 points` : "", "#c1"],
  ["C2", "Incident record", "Over 24 months NEAR has lost no more to hacks, relative to what it held, than peers.", c2.verdict, worse.length ? `${worse.join(" and ")} lost more than NEAR; the other peers lost less` : "every peer lost less",
    pct(c2.near_lower), `of average TVL lost per year · bar: peer median ${pct(c2.peer_median_lower)}–${pct(c2.peer_median_upper)}`, "#c2"],
  ["C3", "Control", "No single signer can upgrade or drain intents.near or the largest NEAR protocols, and upgrades wait out a delay.", c3.C3, `signers test ${c3.C3a}; delay test ${c3.C3b}`,
    c3.intents_min_signers + (c3.intents_min_signers === 1 ? " signer" : " signers"), `can replace the DAO behind intents.near · bar: more than one · upgrade delay on ${pct(c3.c3b_share_with_enforced_delay_pct, 0)} of TVL, bar: over 50%`, "#c3"],
].map(p => `<div class="panel"><div class="kicker">${p[0]} · ${p[1]}</div><p class="claim">${p[2]}</p>
  <div class="word">${p[3] ? vword(p[3]) : "—"}</div><p class="caveat">${esc(p[4])}</p>
  <div class="decide"><span class="big">${esc(p[5])}</span><span class="bar">${esc(p[6])}</span></div><a class="more" href="${p[7]}">Evidence ↓</a></div>`).join("");

$("#prov").innerHTML = `
  <div><div class="k">Claims registered</div><div class="v">commit <span class="mono">${reg.commit.slice(0, 7)}</span><br><span class="num">${esc(reg.committed_utc)}</span> UTC</div></div>
  <div><div class="k">SHA-256 of THESIS.md</div><div class="v"><span class="mono" title="${reg.sha256}">${reg.sha256.slice(0, 12)}…${reg.sha256.slice(-6)}</span><button class="copy" id="copy" type="button">copy</button></div></div>
  <div><div class="k">OpenTimestamps proof</div><div class="v"><span class="mono">registration/THESIS.f84b548.md.ots</span><br>Bitcoin blocks <span class="num">${reg.ots_bitcoin_blocks.join(", ")}</span></div></div>
  <div><div class="k">Anchor on NEAR</div><div class="v"><a href="https://nearblocks.io/txns/${reg.anchor_tx}"><span class="mono">${reg.anchor_tx.slice(0, 10)}…</span></a> · <span class="mono">${esc(reg.anchor_account)}</span><br>block <span class="num">${reg.anchor_block}</span></div></div>
  <div class="order"><b>Order of events (UTC).</b> Claims committed <span class="num">${esc(reg.committed_utc)}</span> → timestamp stamped <span class="num">${esc(reg.ots_stamp_utc)}</span> → first data pull <span class="num">${esc(R.defillama_first_pull.replace("T", " ").replace("Z", ""))}</span> → NEAR anchor <span class="num">${esc(reg.anchor_utc)}</span>. The NEAR anchor came after the first pull; the timestamp proof and the git history are the evidence that the claims came first.</div>`;
$("#copy").addEventListener("click", e => { const b = e.currentTarget, done = () => { b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(reg.sha256).then(done, () => prompt("SHA-256", reg.sha256)); else prompt("SHA-256", reg.sha256); });

/* ---------- summary ---------- */
$("#summary").innerHTML = `<div class="kicker">What the data shows</div>
  <p class="lede">On bounty coverage NEAR is at or above these peers. The gap is in the loss record, where NEAR lost ${pct(c2.near_lower)} of its average TVL per year against a peer median of ${pct(c2.peer_median_lower)} to ${pct(c2.peer_median_upper)}, and in control, where one key can replace the DAO behind <span class="mono">intents.near</span> and no assessed protocol enforces an upgrade delay. The security discount comes from those two, not from bounty spending.</p>
  <p class="small">Three claims and their kill criteria were fixed before the data was pulled. Each verdict below is that rule applied by code to the numbers shown. The author expected C1 to fail; it did not.</p>`;

/* ---------- C1 ---------- */
(function () {
  const el = $("#c1");
  if (!c1) { el.innerHTML = `<div class="sectag"><span class="kicker">C1 · Bounty coverage</span></div><h2>Not computed</h2><p>The bounty table <code>data/bounties.csv</code> has rows without a status, so nothing is shown.</p>`; return; }
  const rows = D.c1_rows, W = 1040, H = 500, m = {l: 76, r: 150, t: 14, b: 118};
  const lx = v => Math.log10(v), x0 = 5.6, x1 = 10.25, y0 = 3.5, y1 = 7.5;
  const X = v => m.l + (lx(Math.max(v, 5e5)) - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (lx(v) - y0) / (y1 - y0) * (H - m.b - m.t);
  const stripN = H - m.b + 34, stripU = stripN + 32;
  const yOf = r => r.status === "live" ? Y(+r.effective_max_usd) : r.status === "none_found" ? stripN : stripU;
  const tipOf = r => `<b>${esc(r.protocol)}</b> · ${esc(r.chain)}<br>Total TVL ${usd(r.total_tvl_usd)}<br>${r.status === "live" ? "Max critical " + usd(r.effective_max_usd) + " (" + pct(r.ratio_pct, 3) + " of TVL)" : esc(r.status_label)}`;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Maximum critical bounty against total TVL for 51 listings, both axes logarithmic">`;
  for (let e = 6; e <= 10; e++) s += `<line class="gr" x1="${X(10 ** e)}" x2="${X(10 ** e)}" y1="${m.t}" y2="${stripU + 12}"/><text class="n" x="${X(10 ** e)}" y="${H - 22}" text-anchor="middle">${usd(10 ** e)}</text>`;
  for (let e = 4; e <= 7; e++) s += `<line class="gr" x1="${m.l}" x2="${W - m.r}" y1="${Y(10 ** e)}" y2="${Y(10 ** e)}"/><text class="n" x="${m.l - 10}" y="${Y(10 ** e) + 4}" text-anchor="end">${usd(10 ** e)}</text>`;
  s += `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/>`;
  [[stripN, "no live bounty"], [stripU, "not checked"]].forEach(([y, l]) => s += `<line class="gr" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke-dasharray="2 4"/><text x="${W - m.r + 10}" y="${y + 4}">${l}</text>`);
  s += `<text x="${m.l}" y="${H - 4}">Total TVL of the listing, log scale →</text><text x="${W - m.r + 10}" y="${m.t + 10}">↑ max critical</text><text x="${W - m.r + 10}" y="${m.t + 25}">payout, log scale</text>`;
  const peers = rows.filter(r => r.chain !== "Near"), near = rows.filter(r => r.chain === "Near");
  peers.forEach(r => s += `<circle cx="${X(+r.total_tvl_usd)}" cy="${yOf(r)}" r="5.5" fill="${r.status === "undetermined" ? "var(--page)" : "var(--peer)"}" stroke="${r.status === "undetermined" ? "var(--peer)" : "var(--page)"}" stroke-width="1.5" data-tip="${tipOf(r)}"/>`);
  const peerLabels = {"uniswap-v4": [8, 4, "start"], "morpho-blue": [0, -11, "middle"], "cetus-clmm": [8, 4, "start"], "kamino-lend": [0, -11, "middle"], "aave-v3": [-9, 4, "end"]};
  peers.filter(r => peerLabels[r.slug] && r.status === "live").forEach(r => { const [dx, dy, a] = peerLabels[r.slug]; s += `<text x="${X(+r.total_tvl_usd) + dx}" y="${yOf(r) + dy}" text-anchor="${a}">${esc(r.protocol)}</text>`; });
  const nearLabels = {"rhea-dex": [-10, 4, "end"], "rhea-lst": [0, 20, "middle"], "rhea-lend": [9, 16, "start"], "near-bridge": [-6, -10, "end"], "near-intents": [8, -8, "start"], "meta-pool-near": [10, 4, "start"], "linear-protocol": [0, -11, "middle"], "kaio": [0, 20, "middle"], "portal": [0, -11, "middle"], "jumbo-exchange": [10, -9, "start"], "here-wallet-staking": [-10, 4, "end"]};
  near.forEach(r => { const x = X(+r.total_tvl_usd), y = yOf(r), [dx, dy, a] = nearLabels[r.slug] || [9, 4, "start"];
    s += `<circle cx="${x}" cy="${y}" r="6.5" fill="${r.status === "undetermined" ? "var(--page)" : "var(--accent)"}" stroke="${r.status === "undetermined" ? "var(--accent)" : "var(--page)"}" stroke-width="2" data-tip="${tipOf(r)}"/><text class="strong" x="${x + dx}" y="${y + dy}" text-anchor="${a}">${esc(r.protocol.replace(" Protocol", "").replace(" Near", "").replace(" staking", ""))}</text>`; });
  s += `<circle cx="${W - m.r + 16}" cy="${H - m.b - 44}" r="6.5" fill="var(--accent)"/><text class="strong" x="${W - m.r + 28}" y="${H - m.b - 40}">NEAR</text><circle cx="${W - m.r + 16}" cy="${H - m.b - 24}" r="5.5" fill="var(--peer)"/><text x="${W - m.r + 28}" y="${H - m.b - 20}">peer chains</text></svg>`;
  const pl = c1.peer_listings, caps = c1.near_live_caps_usd, by = Object.fromEntries(rows.map(r => [r.chain + "/" + r.slug, r]));
  const mp = by["Near/meta-pool-near"], mo = by["Base/morpho-blue"], u4 = by["Base/uniswap-v4"];
  el.innerHTML = `<div class="sectag"><span class="kicker">C1 · Bounty coverage</span><span class="pill">${vword(c1.verdict)}</span><span class="small">${esc(C1_CAVEAT)}</span></div>
